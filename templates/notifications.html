{% extends "base.html" %}{% block content %}<h1>Notifications</h1>{% for n in items %}<div class="card p-3 mb-2"><b>{{ n.title }}</b><p class="mb-1">{{ n.body }}</p><small class="text-muted">{{ n.created_at.strftime('%d %b %Y, %I:%M %p') }} · {% if n.read_at %}Read{% else %}Unread{% endif %}</small>{% if n.url %}<a href="{{ n.url }}">Open</a>{% endif %}</div>{% else %}<p>No notifications.</p>{% endfor %}{% endblock %}
