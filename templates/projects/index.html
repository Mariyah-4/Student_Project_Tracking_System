{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h1>Projects</h1>{% if current_user.role == 'student' %}<a class="btn btn-primary" href="{{ url_for('projects.create') }}">New project</a>{% endif %}</div>{% for p in projects %}<div class="card p-3 mb-2"><h5><a href="{{ url_for('projects.detail', project_id=p.id) }}">{{ p.title }}</a></h5><p>{{ p.description }}</p><small>{{ p.members|length }} collaborators · {{ p.status }}</small></div>{% else %}<p>No projects found.</p>{% endfor %}{% endblock %}
