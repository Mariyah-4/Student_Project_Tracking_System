{% extends "base.html" %}{% block content %}<h1>Project submissions</h1>{% for s in items %}<div class="card p-3 mb-3"><h5>{{ s.project.title }} · {{ s.student.name }}</h5><p>{{ s.original_name }} · {{ s.submitted_at.strftime('%d %b %Y %H:%M') }} · <a href="{{ url_for('submissions.download', submission_id=s.id) }}">Download file</a></p><form method="post" action="{{ url_for('submissions.evaluate', submission_id=s.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-2"><div class="col-md-3"><select name="status" class="form-select"><option value="approved">Approve</option><option value="revision_requested">Request revision</option></select></div><div class="col-md-2"><input type="number" min="0" max="100" step="0.5" name="marks" class="form-control" placeholder="Marks / 100"></div><div class="col-md-5"><input name="feedback" class="form-control" placeholder="Feedback"></div><div class="col-md-2"><button class="btn btn-primary w-100">Save</button></div></div></form></div>{% else %}<p>No submissions yet.</p>{% endfor %}{% endblock %}
